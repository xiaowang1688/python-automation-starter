name: Playwright Browser E2E

on:
  push:
    paths:
      - "browser_tests/**"
      - "examples/demo_order_portal.html"
      - "requirements-browser.txt"
      - ".github/workflows/browser-e2e.yml"
  pull_request:
    paths:
      - "browser_tests/**"
      - "examples/demo_order_portal.html"
      - "requirements-browser.txt"
      - ".github/workflows/browser-e2e.yml"

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run real Chromium browser tests
        run: python -m unittest discover -s browser_tests -v
      - name: Upload browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-screenshot
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 14
